<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helion | Zero-Edge BaaS</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/gpu-animations.css">
</head>
<body class="bg-black text-white font-mono">
    <div id="app" x-data="orchestrator">
        <header class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h1 class="text-xl font-bold">💠 HELION</h1>
            <div id="omnibar" x-data="omnibar">
                <input type="text" placeholder="Ctrl+K to search..." class="bg-gray-900 border border-gray-700 px-3 py-1 rounded text-sm focus:outline-none focus:border-blue-500">
            </div>
        </header>
        <main class="p-8">
            <section id="telemetry">
                <h2 class="text-lg font-semibold mb-4 text-blue-400">🔹 Real-time Telemetry</h2>
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-gray-900 p-4 border border-gray-800 rounded">
                        <span class="text-xs text-gray-500">API Latency</span>
                        <div class="text-2xl font-bold">1.2ms</div>
                    </div>
                    <div class="bg-gray-900 p-4 border border-gray-800 rounded">
                        <span class="text-xs text-gray-500">Active Conns</span>
                        <div class="text-2xl font-bold">142</div>
                    </div>
                    <div class="bg-gray-900 p-4 border border-gray-800 rounded">
                        <span class="text-xs text-gray-500">Uptime</span>
                        <div class="text-2xl font-bold text-green-500">99.99%</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/alpine.min.js"></script>
    <script src="js/anime.min.js"></script>
    <script src="js/orchestrator.js"></script>
    <script src="js/omnibar.js"></script>
    <script src="js/dashboard_rbac.js"></script>
</body>
</html>
